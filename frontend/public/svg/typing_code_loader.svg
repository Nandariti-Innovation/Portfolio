<svg width="640" height="420" viewBox="0 0 640 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="190" y1="80" x2="450" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB078"/>
      <stop offset="1" stop-color="#FF6B24"/>
    </linearGradient>

    <linearGradient id="codeGrad" x1="260" y1="170" x2="390" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD0AD"/>
      <stop offset="1" stop-color="#FF6B24"/>
    </linearGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .base-ring {
        stroke: #492719;
        stroke-width: 8;
        opacity: .72;
      }

      .progress-ring {
        stroke: url(#ringGrad);
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 180 630;
        transform-origin: 320px 205px;
        animation: spinRing 2.6s linear infinite;
        filter: url(#glow);
      }

      @keyframes spinRing {
        0%   { transform: rotate(-90deg); }
        100% { transform: rotate(270deg); }
      }

      .inner-pulse {
        fill: none;
        stroke: #FF8A4C;
        stroke-width: 2;
        opacity: 0;
        transform-origin: 320px 205px;
        animation: innerPulse 2s ease-out infinite;
      }

      @keyframes innerPulse {
        0%   { opacity: .5; transform: scale(.72); }
        100% { opacity: 0; transform: scale(1.16); }
      }

      .code-wrap {
        transform-origin: 320px 205px;
        animation: codeBreath 2.2s ease-in-out infinite;
      }

      @keyframes codeBreath {
        0%,100% { transform: scale(1); opacity: .88; }
        50%     { transform: scale(1.055); opacity: 1; }
      }

      .code-line {
        stroke: url(#codeGrad);
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        filter: url(#smallGlow);
      }

      .slash {
        stroke-dasharray: 82;
        stroke-dashoffset: 82;
        animation: drawSlash 1.8s ease-in-out infinite;
      }

      @keyframes drawSlash {
        0%   { stroke-dashoffset: 82; opacity: .25; }
        45%  { stroke-dashoffset: 0; opacity: 1; }
        75%  { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -82; opacity: .25; }
      }

      .bracket-left {
        stroke-dasharray: 70;
        stroke-dashoffset: 70;
        animation: drawBracket 1.8s ease-in-out infinite;
      }

      .bracket-right {
        stroke-dasharray: 70;
        stroke-dashoffset: 70;
        animation: drawBracket 1.8s ease-in-out .22s infinite;
      }

      @keyframes drawBracket {
        0%   { stroke-dashoffset: 70; opacity: .15; }
        38%  { stroke-dashoffset: 0; opacity: 1; }
        76%  { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -70; opacity: .15; }
      }

      .cursor {
        fill: #FFE2CB;
        filter: url(#smallGlow);
        animation: blink .8s steps(1,end) infinite;
      }

      @keyframes blink {
        0%,48% { opacity: 1; }
        49%,100% { opacity: .12; }
      }

      .dot {
        fill: #FF9B61;
        filter: url(#smallGlow);
        opacity: 0;
        animation: dotFloat 2.8s ease-in-out infinite;
      }

      .d2 { animation-delay: .6s; }
      .d3 { animation-delay: 1.2s; }
      .d4 { animation-delay: 1.8s; }

      @keyframes dotFloat {
        0%   { opacity: 0; transform: translateY(10px) scale(.7); }
        25%  { opacity: .9; }
        70%  { opacity: .35; }
        100% { opacity: 0; transform: translateY(-18px) scale(1.15); }
      }

      .label {
        fill: #F2EFE9;
        font-family: Inter, system-ui, sans-serif;
        font-size: 17px;
        letter-spacing: .8px;
        opacity: .9;
      }

      .sub {
        fill: #9B9994;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 1.4px;
        opacity: .8;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .slash, .bracket-left, .bracket-right { stroke-dashoffset: 0; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Outer loader ring -->
  <circle class="base-ring" cx="320" cy="205" r="112"/>
  <circle class="progress-ring" cx="320" cy="205" r="112"/>

  <!-- Pulsing inner ring -->
  <circle class="inner-pulse" cx="320" cy="205" r="82"/>

  <!-- Floating code particles -->
  <circle class="dot d1" cx="219" cy="129" r="3.8"/>
  <circle class="dot d2" cx="424" cy="150" r="3.4"/>
  <circle class="dot d3" cx="218" cy="270" r="3.1"/>
  <circle class="dot d4" cx="426" cy="282" r="4"/>

  <!-- Code icon -->
  <g class="code-wrap">
    <path class="code-line bracket-left" d="M287 181L260 205L287 229"/>
    <path class="code-line slash" d="M335 166L306 244"/>
    <path class="code-line bracket-right" d="M353 181L380 205L353 229"/>
    <rect class="cursor" x="389" y="224" width="5" height="25" rx="2.5"/>
  </g>

  <!-- Loading copy -->
  <text class="label" x="320" y="362" text-anchor="middle">Compiling the experience...</text>
  <text class="sub" x="320" y="390" text-anchor="middle">BUILD • RENDER • LAUNCH</text>
</svg>
